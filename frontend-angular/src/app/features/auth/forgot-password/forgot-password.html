<div class="min-h-screen flex items-center justify-center px-6 bg-gray-50">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8">
    <a
      [routerLink]="['/' + stack]"
      class="text-sm text-gray-400 hover:text-gray-600 mb-4 inline-block"
    >
      ← Voltar
    </a>

    <h1 class="text-xl font-bold text-gray-900 mb-1">Recuperar senha</h1>
    <p class="text-sm text-gray-500 mb-6">
      Digite seu e-mail e enviaremos um link para redefinir sua senha.
    </p>

    @if (sent()) {
      <p class="text-green-600 text-sm">
        Se o e-mail existir, um link de recuperação foi enviado. Confira sua caixa de entrada.
      </p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <label for="email" class="text-sm">E-mail</label>
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            placeholder="usuario@empresa.com"
            class="w-full"
          />
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <span class="text-red-500 text-xs">E-mail inválido.</span>
          }
        </div>

        <p-button type="submit" label="Enviar link" styleClass="w-full" />
      </form>
    }
  </div>
</div>
