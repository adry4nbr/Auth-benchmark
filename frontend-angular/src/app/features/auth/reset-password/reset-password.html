<div class="min-h-screen flex items-center justify-center px-6 bg-gray-50">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-xl font-bold text-gray-900 mb-1">Redefinir senha</h1>
    <p class="text-sm text-gray-500 mb-6">Escolha uma nova senha para sua conta.</p>

    @if (successMessage()) {
      <p class="text-green-600 text-sm mb-4">{{ successMessage() }}</p>
      <a routerLink="/" class="text-sm text-blue-600 hover:underline">Voltar ao início</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <label for="newPassword" class="text-sm">Nova senha</label>
          <p-password
            id="newPassword"
            formControlName="newPassword"
            [feedback]="false"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
            placeholder="••••••••"
          />
          @if (form.get('newPassword')?.invalid && form.get('newPassword')?.touched) {
            <span class="text-red-500 text-xs">Mínimo de 8 caracteres.</span>
          }
        </div>

        @if (errorMessage()) {
          <p class="text-red-500 text-sm">{{ errorMessage() }}</p>
        }

        <p-button type="submit" label="Redefinir senha" styleClass="w-full" />
      </form>
    }
  </div>
</div>
