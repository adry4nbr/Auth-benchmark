<div class="relative min-h-screen bg-[#eef7ea] overflow-hidden">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div
    class="relative bg-white border-b border-[#d3efc2] px-6 py-4 flex items-center justify-between"
  >
    <div class="flex items-center gap-3">
      <a routerLink="/springboot" class="text-[#4a8a28] text-sm hover:underline">← Voltar</a>
      <span class="text-gray-300">|</span>
      <div class="w-6 h-6 rounded bg-[#6db33f] flex items-center justify-center">
        <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="#ffffff">
          <path [attr.d]="springIcon"></path>
        </svg>
      </div>
      <span class="text-gray-900 font-bold">Spring Boot Admin</span>
    </div>
    <button
      (click)="logout()"
      class="px-3 py-1 rounded-md text-xs border border-[#6db33f] text-[#4a8a28] hover:bg-[#6db33f]/10 transition-colors"
    >
      Sair
    </button>
  </div>

  <div class="relative p-16">
    <div class="bg-white rounded-2xl shadow-xl border border-[#d3efc2] overflow-hidden">
      <div class="px-6 py-4 border-b border-[#d3efc2] flex items-center justify-between">
        <div>
          <h1 class="text-xl font-bold text-gray-900">Usuários cadastrados</h1>
          <p class="text-xs text-[#4a8a28]">Spring Security · JPA Repository</p>
        </div>
        <div class="text-right">
          <p class="text-xs text-gray-400">Total de usuários</p>
          <p class="text-2xl font-bold text-[#4a8a28]">{{ totalUsers() ?? '—' }}</p>
        </div>
      </div>

      <app-users-table
        stack="springboot"
        [customPaginator]="true"
        deleteVariant="pill"
        (totalUsersChange)="onTotalUsersChange($event)"
        headerBg="#f0f7ea"
        headerColor="#4a8a28"
        rowBg="#ffffff"
        rowColor="#6b7280"
        rowStripedBg="#f7fbf4"
        rowHoverBg="#eef7e8"
        borderColor="#d3efc2"
        paginatorBg="#f0f7ea"
        paginatorColor="#4a8a28"
        deletePillBg="#eef7e8"
        deletePillColor="#4a8a28"
        deletePillBorder="#c1e3ab"
      />
    </div>
  </div>
</div>
