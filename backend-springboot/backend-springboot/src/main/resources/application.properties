spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/authdb_springboot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret-dev-only-secret-0123456789}
jwt.expiration=3600000

admin.name=${ADMIN_NAME:Administrador}
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

frontend.url=${FRONTEND_URL:http://localhost:4200}
google.client-id=${GOOGLE_CLIENT_ID}

server.port=${PORT:8080}
server.servlet.context-path=/api/v1
server.forward-headers-strategy=native

brevo.api-key=${BREVO_API_KEY:}
mail.from=${MAIL_FROM:}